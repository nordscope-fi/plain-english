# Behavioural corpus. Every case here is an assertion about the engine.
#
#   expect: pass    no error-severity findings
#   expect: block   at least one error finding; `rule` must be among them
#   warns: [id]     exactly these warn-severity rule ids must fire
#
# Adding a rule means adding at least one `block` case and one `pass` case that
# exercises its `unless` clause. Every bug that reaches a user gets a case in
# regressions.yml so it can never come back.

cases:
  # ==========================================================================
  # False positives verified against the original regex before the rewrite.
  # All 13 of these blocked under the old pattern. None may block now.
  # ==========================================================================

  - name: "fails silently is standard technical usage"
    expect: pass
    text: "The parser fails silently when the file is missing."

  - name: "mechanical keyboard is an ordinary noun phrase"
    expect: pass
    text: "Use a mechanical keyboard for this."

  - name: "underscores as a noun describing characters"
    expect: pass
    text: "The filename underscores are significant."

  - name: "underscores inside an identifier"
    expect: pass
    text: "Rename it to my_var_underscores_here."

  - name: "banned words inside a fenced code block"
    expect: pass
    text: |
      Here is the call:

      ```js
      const url = leverage.utilize();
      ```

  - name: "banned word inside a URL"
    expect: pass
    text: "See https://example.com/dive-into-rust for details."

  - name: "banned word inside quoted third-party text"
    expect: pass
    text: "> Customer wrote: we want to leverage your API"

  - name: "holistic medicine is a real domain term"
    expect: pass
    text: "A holistic medicine startup, our client."

  - name: "plain hyphenated number range"
    expect: pass
    text: "This runs 4-6 hours."

  - name: "cutting edges plural is not the buzzword"
    expect: pass
    text: "The cutting edges of the sheet are welded."

  - name: "boasts about is the ordinary verb"
    expect: pass
    text: "He boasts about the uptime figures constantly."

  - name: "identifier in inline code"
    expect: pass
    text: "Import it with `import { synergy } from './lib'` at the top."

  - name: "quietly in a code comment inside a fence"
    expect: pass
    text: |
      ```python
      # exits quietly when the queue drains
      sys.exit(0)
      ```

  # ==========================================================================
  # Punctuation
  # ==========================================================================

  - name: "em dash blocks"
    expect: block
    rule: em-dash
    text: "The build failed — the cache was stale."

  - name: "em dash inside a code fence passes"
    expect: pass
    text: |
      ```
      printf 'a — b'
      ```

  - name: "en dash used as a sentence break warns"
    expect: pass
    warns: [en-dash-as-punctuation]
    text: "The build failed – the cache was stale."

  - name: "en dash in a numeric range passes"
    expect: pass
    text: "Sections 4–7 cover the migration."

  # Every one of these defeated the em dash rule before normalisation.
  # None of these require intentional evasion.
  - name: "em dash as an HTML entity blocks"
    expect: block
    rule: em-dash
    text: "The build failed &mdash; the cache was stale."

  - name: "em dash as a numeric entity blocks"
    expect: block
    rule: em-dash
    text: "The build failed &#8212; the cache was stale."

  - name: "horizontal bar blocks"
    expect: block
    rule: em-dash
    text: "The build failed ― the cache was stale."

  - name: "fullwidth dash blocks"
    expect: block
    rule: em-dash
    text: "The build failed － the cache was stale."

  - name: "zero-width space inside a word does not hide it"
    expect: block
    rule: furthermore
    text: "Fur​thermore, the cache was stale."

  - name: "non-breaking hyphen is treated as a hyphen"
    expect: block
    rule: load-bearing
    text: "That default is load‑bearing for the pipeline."

  - name: "an entity inside a code fence is still not scanned"
    expect: pass
    text: |
      ```html
      <p>a &mdash; b</p>
      ```

  # ==========================================================================
  # Stock transitions
  # ==========================================================================

  - name: "furthermore blocks"
    expect: block
    rule: furthermore
    text: "Furthermore, the cache was stale."

  - name: "moreover blocks"
    expect: block
    rule: moreover
    text: "Moreover, the cache was stale."

  - name: "in conclusion blocks"
    expect: block
    rule: in-conclusion
    text: "In conclusion, the migration worked."

  - name: "it is worth noting blocks"
    expect: block
    rule: worth-noting
    text: "It's worth noting that the cache was stale."

  - name: "it is important to note blocks"
    expect: block
    rule: worth-noting
    text: "It is important to note that the cache was stale."

  - name: "it is important to understand blocks"
    expect: block
    rule: worth-noting
    text: "It is important to understand that the cache was stale."

  - name: "it's important to remember blocks"
    expect: block
    rule: worth-noting
    text: "It's important to remember that the cache was stale."

  - name: "it is worth mentioning blocks"
    expect: block
    rule: worth-noting
    text: "It is worth mentioning that the cache was stale."

  # The tell is the verb of noticing, not the phrase 'important to'. A sentence
  # that says something is important to DO is making a claim, not stalling.
  - name: "important to do a real thing passes"
    expect: pass
    text: "It is important to test the migration before you run it."

  - name: "at the end of the day as a discourse marker blocks"
    expect: block
    rule: at-the-end-of-the-day
    text: "At the end of the day, the cache was stale."

  - name: "at the end of the day in the literal temporal sense passes"
    expect: pass
    text: "The batch runs at the end of the day and writes a summary."

  - name: "let us dive in blocks"
    expect: block
    rule: lets-dive-in
    text: "Let's dive in and see what broke."

  - name: "dive into warns"
    expect: pass
    warns: [dive-into]
    text: "Dive into the access logs to find the request."

  - name: "dive into a pool passes"
    expect: pass
    text: "Do not dive into the pool from the side."

  # ==========================================================================
  # Corporate verbs
  # ==========================================================================

  - name: "leverage as a verb blocks"
    expect: block
    rule: leverage
    text: "We leverage the existing cache for this."

  - name: "financial leverage passes"
    expect: pass
    text: "The financial leverage ratio stayed under 2.0 all year."

  - name: "leveraged buyout passes"
    expect: pass
    text: "The firm financed it as a leveraged buyout in 2019."

  - name: "utilize blocks"
    expect: block
    rule: utilize
    text: "We utilize the existing cache for this."

  - name: "utilisation is a real capacity term and passes"
    expect: pass
    text: "CPU utilization stayed under 40% during the run."

  - name: "delve blocks"
    expect: block
    rule: delve
    text: "Let us delve into the access logs."

  - name: "showcase blocks"
    expect: block
    rule: showcase
    text: "This page showcases the new report."

  - name: "glass showcase passes"
    expect: pass
    text: "The samples sit in a glass showcase by the entrance."

  - name: "boasts blocks"
    expect: block
    rule: boasts
    text: "The service boasts 99.9% uptime."

  - name: "underscores as a verb warns"
    expect: pass
    warns: [underscores-verb]
    text: "That result underscores the need for a second check."

  # ==========================================================================
  # Buzzwords
  # ==========================================================================

  - name: "seamless blocks"
    expect: block
    rule: seamless
    text: "The migration was seamless."

  - name: "seamless pipe passes"
    expect: pass
    text: "Order the seamless pipe in 40mm."

  - name: "cutting-edge blocks"
    expect: block
    rule: cutting-edge
    text: "A cutting-edge approach to caching."

  - name: "cutting edge with a space blocks"
    expect: block
    rule: cutting-edge
    text: "A cutting edge approach to caching."

  - name: "holistic warns"
    expect: pass
    warns: [holistic]
    text: "We took a holistic view of the pipeline."

  - name: "synergy blocks"
    expect: block
    rule: synergy
    text: "The synergy between the two teams paid off."

  - name: "paradigm shift blocks"
    expect: block
    rule: paradigm-shift
    text: "This is a paradigm shift in how we cache."

  - name: "game-changer blocks"
    expect: block
    rule: game-changer
    text: "The new index is a game-changer."

  - name: "unlock the potential blocks"
    expect: block
    rule: unlock-the
    text: "This will unlock the potential of the dataset."

  - name: "unlock the door passes"
    expect: pass
    text: "The badge will unlock the door on the second floor."

  - name: "unlock the account passes"
    expect: pass
    text: "Support can unlock the account after three failed logins."

  - name: "elevate your blocks"
    expect: block
    rule: elevate-your
    text: "Elevate your reporting with the new dashboard."

  - name: "in today's fast-paced blocks"
    expect: block
    rule: in-todays-x
    text: "In today's fast-paced environment, caching matters."

  # ==========================================================================
  # AI self-reference
  # ==========================================================================

  - name: "as an AI blocks"
    expect: block
    rule: as-an-ai
    text: "As an AI, I cannot open that file."

  - name: "as a large language model blocks"
    expect: block
    rule: as-an-ai
    text: "As a large language model, I cannot open that file."

  # ==========================================================================
  # Soft-focus adverbs (warn, because each has a real technical sense)
  # ==========================================================================

  - name: "bare silently warns"
    expect: pass
    warns: [silently]
    text: "The job silently rewrote the config."

  - name: "silently ignores passes"
    expect: pass
    text: "The parser silently ignores unknown keys."

  - name: "silent mode passes"
    expect: pass
    text: "Run the installer in silent mode."

  - name: "quietly warns"
    expect: pass
    warns: [quietly]
    text: "The job quietly rewrote the config."

  - name: "mechanically warns"
    expect: pass
    warns: [mechanical]
    text: "The script mechanically applies the same edit everywhere."

  - name: "mechanical engineer passes"
    expect: pass
    text: "Ask the mechanical engineer about the tolerance."

  - name: "load-bearing as a metaphor blocks"
    expect: block
    rule: load-bearing
    text: "That default is load-bearing for the whole pipeline."

  - name: "load-bearing wall passes"
    expect: pass
    text: "The survey confirmed it is a load-bearing wall."

  # ==========================================================================
  # Masking: structure that must never be scanned
  # ==========================================================================

  - name: "YAML frontmatter is not scanned"
    expect: pass
    text: |
      ---
      title: Leverage and synergy in caching
      ---

      The cache holds parsed results for an hour.

  - name: "indented code block is not scanned"
    expect: pass
    text: |
      Run this:

          leverage --utilize --seamless

      Then check the output.

  - name: "markdown link target is not scanned"
    expect: pass
    text: "See [the guide](https://example.com/leverage-synergy) for the steps."

  - name: "markdown link text IS scanned"
    expect: block
    rule: leverage
    text: "See [how to leverage the cache](https://example.com/guide) for the steps."

  - name: "autolink is not scanned"
    expect: pass
    text: "Docs live at <https://example.com/seamless-migration>."

  - name: "nested fence with a longer marker is not scanned"
    expect: pass
    text: |
      ````md
      ```js
      leverage()
      ```
      ````

  - name: "text after a closed fence IS scanned"
    expect: block
    rule: leverage
    text: |
      ```js
      const a = 1;
      ```

      We leverage that value downstream.

  - name: "blockquote is not scanned"
    expect: pass
    text: |
      > Furthermore, we utilize a holistic paradigm shift.

      Their words, not ours.

  - name: "text after a blockquote IS scanned"
    expect: block
    rule: furthermore
    text: |
      > Their original wording is preserved here.

      Furthermore, the cache was stale.

  # ==========================================================================
  # Structure the parser handles that the previous regex masker got wrong.
  # Each of these was a real bug found by an adversarial pass.
  # ==========================================================================

  - name: "HTML pre block is not scanned"
    expect: pass
    text: |
      <pre>
      leverage()
      </pre>

  - name: "inline HTML code tag content is not scanned"
    expect: pass
    text: "Call <code>leverage()</code> to warm the cache."

  - name: "inline HTML kbd content is not scanned"
    expect: pass
    text: "Press <kbd>utilize</kbd> to continue."

  - name: "prose after an inline HTML code tag IS scanned"
    expect: block
    rule: furthermore
    text: "Call <code>leverage()</code> first. Furthermore, check the log."

  - name: "TOML frontmatter is not scanned"
    expect: pass
    text: |
      +++
      title = "Leverage and synergy in caching"
      +++

      The cache holds parsed results for an hour.

  - name: "body after TOML frontmatter IS scanned"
    expect: block
    rule: furthermore
    text: |
      +++
      title = "Caching"
      +++

      Furthermore, the cache was stale.

  - name: "footnote definition prose IS scanned"
    expect: block
    rule: furthermore
    text: |
      Here is a claim.[^1]

      [^1]: Furthermore, the cache was stale.

  - name: "link reference definition is not scanned"
    expect: pass
    text: |
      See [the guide][ref].

      [ref]: https://example.com/leverage-synergy

  - name: "four-space-indented list continuation IS prose"
    expect: block
    rule: furthermore
    text: |
      - item

          Furthermore, this is list body prose, not a code block.

  - name: "setext heading IS scanned"
    expect: block
    rule: leverage
    text: |
      Leverage the cache
      ==================

  - name: "image alt text is not scanned"
    expect: pass
    text: "![leverage diagram](img.png)"

  - name: "unclosed inline backtick leaves the text as prose"
    expect: block
    rule: leverage
    text: "A ` leverage and more text"

  - name: "CRLF line endings do not break offsets"
    expect: block
    rule: furthermore
    text: "Furthermore, this fails.\r\nSecond line.\r\n"

  - name: "lazy blockquote continuation stays part of the quote"
    expect: pass
    text: |
      > Furthermore
      we utilize this on the lazy continuation line

  # ==========================================================================
  # Suppression. These directives are read from masked text, so an example of
  # one inside a code fence is documentation, not a live directive.
  # ==========================================================================

  - name: "disable-next-line suppresses the named rule"
    expect: pass
    text: |
      <!-- plain-english-disable-next-line leverage: caching sense, not the verb -->
      We leverage the existing cache here on purpose.

  - name: "disable-next-line does not suppress a different rule"
    expect: block
    rule: furthermore
    text: |
      <!-- plain-english-disable-next-line leverage: caching sense -->
      Furthermore, we leverage the cache.

  - name: "disable-next-line with no rule id suppresses the whole line"
    expect: pass
    text: |
      <!-- plain-english-disable-next-line: quoting a vendor release note -->
      Furthermore, we leverage a seamless paradigm shift.

  - name: "disable-next-line only reaches the next line"
    expect: block
    rule: leverage
    text: |
      <!-- plain-english-disable-next-line leverage: caching sense -->
      We leverage the cache here on purpose.
      We leverage it again here by mistake.

  - name: "a disable range suppresses until enable"
    expect: pass
    text: |
      <!-- plain-english-disable: quoting a vendor release note verbatim -->

      Furthermore, we leverage a seamless paradigm shift.

      <!-- plain-english-enable -->

  - name: "text after enable IS checked again"
    expect: block
    rule: furthermore
    text: |
      <!-- plain-english-disable: caching sense -->

      We leverage this on purpose.

      <!-- plain-english-enable -->

      Furthermore, the cache was stale.

  - name: "a named disable range only suppresses that rule"
    expect: block
    rule: furthermore
    text: |
      <!-- plain-english-disable leverage: caching sense -->

      Furthermore, we leverage the cache.

      <!-- plain-english-enable -->

  - name: "an unclosed disable range runs to the end of the document"
    expect: pass
    text: |
      <!-- plain-english-disable: quoting a vendor release note verbatim -->

      Furthermore, we leverage a seamless paradigm shift.

      Still suppressed down here.

  - name: "a disable range example inside a code fence is NOT a directive"
    expect: block
    rule: paradigm-shift
    text: |
      Turn it off for a section:

      ```markdown
      <!-- plain-english-disable -->
      ```

      That is a paradigm shift in how we document this.

  - name: "disable-file suppresses everything"
    expect: pass
    text: |
      <!-- plain-english-disable-file: reference material, lists every banned term -->

      Furthermore, we leverage a seamless paradigm shift.

  - name: "a disable-file example inside a code fence is NOT a directive"
    expect: block
    rule: paradigm-shift
    text: |
      To turn the linter off for a whole file:

      ```markdown
      <!-- plain-english-disable-file -->
      ```

      That is a paradigm shift in how we document this.

  - name: "a disable-next-line example inside a code fence is NOT a directive"
    expect: block
    rule: leverage
    text: |
      Suppress one rule on one line:

      ```markdown
      <!-- plain-english-disable-next-line leverage -->
      ```

      We leverage the cache downstream.

  # A waiver has to say why. The rule that asks for it is the one rule an
  # in-file directive cannot silence, because `disable-file` would otherwise
  # cover the reasonless `disable-file` reporting it.

  - name: "a waiver with no reason warns"
    expect: pass
    warns: [unexplained-suppression]
    text: |
      <!-- plain-english-disable-next-line leverage -->
      We leverage the cache here.

  - name: "a reasonless disable-file is still reported"
    expect: pass
    warns: [unexplained-suppression]
    text: |
      <!-- plain-english-disable-file -->

      Furthermore, we leverage a seamless paradigm shift.

  - name: "enable closes a range and needs no reason"
    expect: pass
    text: |
      <!-- plain-english-disable: quoting a vendor release note verbatim -->

      Furthermore, we leverage a seamless paradigm shift.

      <!-- plain-english-enable -->

  # ==========================================================================
  # Readability. These measure prose shape rather than matching a term.
  #
  # The example that motivated them is 26 words with five unexplained terms.
  # It is not a long sentence. What makes it hard is that nothing in it was
  # ever explained, so unglossed-term is the rule that does the work.
  # ==========================================================================

  - name: "unexplained acronyms fire, and the sentence length does not"
    expect: pass
    warns: [unglossed-term]
    text: "The OIDC trusted publisher attaches SLSA provenance to the tarball at publish time, which the registry verifies against the workflow identity asserted by the id-token claim."

  - name: "the glossed rewrite of the same idea is clean"
    expect: pass
    text: "GitHub signs a receipt proving where the code came from. npm checks that receipt. That proof is called provenance."

  - name: "well-known names are not jargon"
    expect: pass
    text: "We use TypeScript with PostgreSQL and deploy through GitHub, storing JSON over HTTPS."

  - name: "a repeated acronym is reported once, on first use"
    expect: pass
    warns: [unglossed-term]
    text: "The RLS policy is checked. RLS applies here. RLS again. And RLS once more."

  - name: "a camel-cased internal name is jargon"
    expect: pass
    warns: [unglossed-term]
    text: "The PreToolUse handler receives the payload and decides."

  - name: "an acronym inside inline code is not scanned"
    expect: pass
    text: "Set `OIDC_TOKEN` in the environment before running it."

  - name: "an acronym inside a fenced block is not scanned"
    expect: pass
    text: |
      ```bash
      export OIDC_AUDIENCE=npm
      curl --header "SLSA: v1"
      ```

  - name: "an acronym in a quote is somebody else's problem"
    expect: pass
    text: "> The OIDC publisher attaches SLSA provenance automatically."

  - name: "a 47-word sentence fires"
    expect: pass
    warns: [long-sentence]
    text: "When the workflow runs on a hosted machine it asks for an identity token, which the registry then exchanges for a short lived publishing credential after checking that the repository and the workflow filename match what was registered earlier, and only then does the upload actually proceed."

  - name: "a 30-word sentence does not fire"
    expect: pass
    text: "When the workflow runs on a hosted machine it asks for a token, which the registry exchanges for a credential after checking the repository matches what was registered."

  - name: "sentence length is counted per sentence, not per paragraph"
    expect: pass
    text: |
      The build failed. The cache was stale. We cleared it and ran the job again.
      Then the tests passed and the release went out without any further trouble.

  - name: "an abbreviation does not end a sentence"
    expect: pass
    text: "Use a linter, e.g. Vale or textlint, before you commit anything to the repository."

  - name: "a version number does not end a sentence"
    expect: pass
    text: "We shipped v0.1.3 today and it works."

  - name: "readability findings can be suppressed by rule id"
    expect: pass
    text: |
      <!-- plain-english-disable-next-line unglossed-term: glossed two paragraphs up -->
      The OIDC publisher handles this.

  # A term that arrives with its explanation has already done what the rule
  # asks for. Flagging it would tell the author to do what they just did.

  - name: "is called X counts as a gloss"
    expect: pass
    text: "The identity check is called OIDC, and it needs no password."

  - name: "known as X counts as a gloss"
    expect: pass
    text: "A signed record of where a package was built, known as SLSA provenance."

  - name: "X stands for counts as a gloss"
    expect: pass
    text: "OIDC stands for OpenID Connect and handles the identity check."

  - name: "X, which means counts as a gloss"
    expect: pass
    text: "The runner asks for a token via OIDC, which means no password is stored."

  - name: "a parenthetical expansion counts as a gloss"
    expect: pass
    text: "The build attaches SLSA (a signed record of where the code came from)."

  # The other order, and the one the style guide asks for: say the thing, then
  # name it. "Explain a thing before naming it" is a rule in this repository's
  # own writing guide, so the checker has to read the form that follows it.
  - name: "an expansion before the acronym counts as a gloss"
    expect: pass
    text: "The build attaches a signed record of where the code came from (SLSA)."

  - name: "a bracket that opens a clause is not a gloss"
    expect: pass
    warns: [unglossed-term]
    text: "The upload runs without a password. (SLSA provenance is attached at publish time.)"

  - name: "naming without explaining still fires"
    expect: pass
    warns: [unglossed-term]
    text: "The OIDC publisher handles the upload for us."

  # An acronym and a shouted word are the same shape. Reported across one
  # repository's documentation, 129 of 274 findings were words in capitals.
  - name: "a word shouted for emphasis is not an acronym"
    expect: pass
    text: "End every workflow with DONE plus one to three next actions."

  - name: "a run of shouted words is not a run of acronyms"
    expect: pass
    text: "Mark it GREEN, not AMBER or RED. This is ALWAYS the case and NEVER the other way."

  # These are caught by their endings rather than by the list, so a word nobody
  # thought to list is still handled.
  - name: "an inflected word in capitals is not an acronym"
    expect: pass
    text: "The result is CONFIRMED, PARTIALLY VALIDATED and still UPDATING."

  - name: "a real acronym that is also an English word still fires"
    expect: pass
    warns: [unglossed-term]
    text: "The ROI is measured monthly."

  # ==========================================================================
  # Padding. Fixed phrases that carry no information, from Strunk's rule 13.
  #
  # All warn. None of these is wrong, only long, and a rule that blocks on a
  # phrase this ordinary would be the kind of gate people route around.
  # ==========================================================================

  - name: "the fact that warns"
    expect: pass
    warns: [the-fact-that]
    text: "Despite the fact that the cache was warm, the page took two seconds."

  - name: "in order to warns"
    expect: pass
    warns: [in-order-to]
    text: "We added a retry in order to survive a flaky network."

  - name: "in terms of warns"
    expect: pass
    warns: [in-terms-of]
    text: "The plan is weak in terms of cost."

  - name: "expressed in terms of passes"
    expect: pass
    text: "The threshold is expressed in terms of requests per second."

  - name: "able to warns"
    expect: pass
    warns: [able-to]
    text: "The runner is able to reach the registry."

  - name: "has the ability to warns"
    expect: pass
    warns: [able-to]
    text: "The plugin has the ability to rewrite the header."

  - name: "a number of warns"
    expect: pass
    warns: [a-number-of]
    text: "A number of tests broke after the upgrade."

  - name: "in a manner warns"
    expect: pass
    warns: [in-a-manner]
    text: "The job retried in a haphazard manner."

  - name: "in a useful way passes"
    expect: pass
    text: "The trace orders the calls in a useful way."

  - name: "as to whether warns"
    expect: pass
    warns: [as-to-whether]
    text: "The team disagreed as to whether the fix was safe."

  - name: "not un warns"
    expect: pass
    warns: [not-un]
    text: "A stale lock file is not uncommon after a crash."

  - name: "not undefined passes"
    expect: pass
    text: "Check that the value is not undefined before you read it."

  - name: "not unique passes"
    expect: pass
    text: "The index warns when a key is not unique."

  - name: "not unless passes"
    expect: pass
    text: "Do not retry, not unless the caller asked for it."

  # Both of these fired in real documentation. 'un' is not a prefix in either
  # word: strip it and 'iversal' and 'derscores' are left.
  - name: "not universal passes"
    expect: pass
    text: "Percentages are one source's field results, not universal benchmarks."

  - name: "not underscores passes"
    expect: pass
    text: "Use lowercase and hyphens, not underscores, and no spaces."

  - name: "not understood passes"
    expect: pass
    text: "The cause of the stall is not understood."

  - name: "not unanimous passes"
    expect: pass
    text: "The vote to ship was not unanimous."

  # The exception list must not swallow the rule it qualifies. 'unclear' starts
  # with the same three letters as 'uncle' and is an ordinary litotes.
  - name: "not unclear still warns"
    expect: pass
    warns: [not-un]
    text: "The failure mode is not unclear."

  - name: "prior to warns"
    expect: pass
    warns: [prior-to]
    text: "Run the migration prior to the deploy."

  - name: "with respect to warns"
    expect: pass
    warns: [with-respect-to]
    text: "The report says nothing with respect to cost."

  # ==========================================================================
  # Chat tells. `channel: chat` judges the case with the chat ruleset, which is
  # the document ruleset plus these. Each has a case that fires and a case that
  # does not, because every one of them is a phrase with an innocent twin.
  # ==========================================================================

  - name: "an affirmation opener is a chat finding"
    channel: chat
    expect: block
    rule: affirmation-opener
    text: "Great question. The answer is four."

  - name: "the same words mid-reply are somebody being quoted"
    channel: chat
    expect: pass
    text: "You asked whether that counts as a great question. It does not."

  - name: "you're absolutely right, with a curly apostrophe"
    channel: chat
    expect: block
    rule: affirmation-opener
    text: "You\u2019re absolutely right, the path was wrong."

  - name: "announcing structure instead of doing it"
    channel: chat
    expect: block
    rule: announced-structure
    text: "Let me start by explaining how the parser works."

  - name: "starting something is not announcing it"
    channel: chat
    expect: pass
    text: "The parser reads the file, then masks every code span."

  - name: "a closing pleasantry"
    channel: chat
    expect: block
    rule: closing-pleasantry
    text: "Two files changed and the tests pass. Hope this helps."

  - name: "an offer of specific further work is not a pleasantry"
    channel: chat
    expect: pass
    text: "Two files changed. The migration is still unwritten: want that next?"

  - name: "a concession formula standing in for a correction"
    channel: chat
    expect: pass
    warns: [concession-formula]
    text: "Fair point. The rate is measured per thousand words."

  - name: "naming the error instead of conceding warns about nothing"
    channel: chat
    expect: pass
    text: "I had the denominator wrong. It is per thousand words, so the rate is 3.4 and not 34."

  - name: "error theatre"
    channel: chat
    expect: pass
    warns: [error-theatre]
    text: "Uh oh, the build did not come back."

  - name: "quoting what the log actually said is not theatre"
    channel: chat
    expect: pass
    text: "The build failed at step 4 with exit code 2. The cause is a missing lockfile."

  - name: "a chat tell inside a code span is not a finding"
    channel: chat
    expect: pass
    text: "The banned opener is matched by `Great question` at the start of a reply."

  - name: "chat tells do not fire on a document"
    expect: pass
    text: "Great question. The answer is four."

  # ==========================================================================
  # Vocabulary drawn from two published rulesets read on 2026-08-20: the
  # `unslop` skill in cursor/plugins, and ClaudeFire's `readable.md`. Between
  # them they name about fifty terms this ruleset had no rule for.
  #
  # Grouped rather than one rule per word, because every live rule needs a case
  # here and forty-five rules would mean ninety cases saying the same thing.
  #
  # The split is by whether the word has a real sense to protect. Puffery
  # blocks: there is no technical reading of "tapestry" to preserve. A metaphor
  # borrowed into engineering warns, because the reader may be quoting somebody
  # or writing about the literal thing.
  # ==========================================================================

  - name: "puffery nouns block"
    expect: block
    rule: puffery-nouns
    text: "The result is a testament to the team and a rich tapestry of ideas."

  - name: "a will and testament is the literal sense"
    expect: pass
    text: "The clause appears in his last will and testament."

  - name: "the Old Testament is a proper noun"
    expect: pass
    text: "The quotation is from the Old Testament."

  - name: "pivotal blocks"
    expect: block
    rule: pivotal
    text: "This release was a pivotal moment for the project."

  - name: "promotional adjectives block"
    expect: block
    rule: promotional-adjectives
    text: "A vibrant community built this groundbreaking tool."

  - name: "nestled blocks"
    expect: block
    rule: promotional-adjectives
    text: "The config file is nestled inside the dot directory."

  - name: "an evolving landscape blocks"
    expect: block
    rule: evolving-landscape
    text: "Security is an ever-evolving landscape that teams must navigate."

  - name: "the landscape as an abstract noun blocks"
    expect: block
    rule: abstract-landscape
    text: "The competitive landscape has changed since the last release."

  - name: "a literal landscape is fine"
    expect: pass
    text: "The photo is in landscape orientation."

  - name: "deeply rooted blocks"
    expect: block
    rule: deeply-rooted
    text: "The problem is deeply rooted in how the parser was written."

  - name: "a rooted tree is not the tell"
    expect: pass
    text: "The tree is rooted at the repository directory."

  # A Reddit list of 100 phrases supplied on 2026-08-26 mixes strong tells,
  # ordinary prose and malformed fragments. These cases cover the closed,
  # high-signal subset added to the default ruleset.
  - name: "inflated significance blocks"
    expect: block
    rule: inflated-significance
    text: "This launch is a significant step forward and a testament to our unwavering commitment."

  - name: "an actual reminder can be stated plainly"
    expect: pass
    text: "The alert reminds the operator to close the valve."

  - name: "formulaic importance warns"
    expect: pass
    warns: [formulaic-importance]
    text: "The study provides a valuable insight and highlights the importance of caching."

  - name: "a concrete finding needs no importance frame"
    expect: pass
    text: "The study found that caching cut median latency by 40 milliseconds."

  - name: "staged progress warns"
    expect: pass
    warns: [staged-progress]
    text: "This milestone laid the groundwork for the path ahead."

  - name: "a concrete next step needs no journey frame"
    expect: pass
    text: "Next, add the index and rerun the latency test."

  - name: "academic fog warns"
    expect: pass
    warns: [academic-fog]
    text: "The study sheds light on the complex interplay between cost and latency."

  - name: "a specific relationship needs no academic frame"
    expect: pass
    text: "Each extra replica cuts latency by 8 milliseconds and adds $40 a month."

  - name: "bare underscore warns too"
    expect: pass
    warns: [underscores-verb]
    text: "These failures underscore the need for a second check."

  - name: "abstract metaphor nouns warn"
    expect: pass
    warns: [abstract-metaphor-nouns]
    text: "The cache is the substrate everything else is built on."

  - name: "north star warns"
    expect: pass
    warns: [abstract-metaphor-nouns]
    text: "Latency is our north star for this quarter."

  - name: "a growth substrate is the literal sense"
    expect: pass
    text: "The sample is grown on a silicon substrate."

  - name: "a vantage point is ordinary English"
    expect: pass
    text: "From that vantage point the whole valley is visible."

  - name: "borrowed engineering metaphors warn"
    expect: pass
    warns: [borrowed-metaphors]
    text: "That API is a footgun with a large blast radius."

  - name: "cargo cult warns"
    expect: pass
    warns: [borrowed-metaphors]
    text: "Copying the config without reading it is cargo cult engineering."

  - name: "a sidecar container is the standard term"
    expect: pass
    text: "Logging runs in a sidecar container beside the app."

  - name: "a fancy way to say is warns"
    expect: pass
    warns: [fancy-is]
    text: "The adapter serves as a translation table between the two."

  - name: "serving as a proxy is the literal sense"
    expect: pass
    text: "nginx serves as a reverse proxy in front of the app."

  - name: "an unnamed authority warns"
    expect: pass
    warns: [vague-attribution]
    text: "Experts believe the approach does not scale."

  - name: "a named source is not a weasel"
    expect: pass
    text: "The Node maintainers say the approach does not scale."

  # ==========================================================================
  # Figurative placement, and the mic-drop ending.
  #
  # Ported from tbhb/vale-ai-tells (MIT): FigurativeHolds, FigurativeSits and
  # MicDrop. That project's finding is that a figurative verb has to be gated
  # on its complement rather than on the verb, because the literal sense is
  # everywhere. The `layer` and `is where` alternatives are this project's own.
  # ==========================================================================

  - name: "layer used for spatial position warns"
    expect: pass
    warns: [figurative-placement]
    text: "Check the layer underneath the reporting."

  - name: "an abstract process given a location warns"
    expect: pass
    warns: [figurative-placement]
    text: "Enrichment is where stacks go bad."

  - name: "a claim graded like a beam warns"
    expect: pass
    warns: [figurative-placement]
    text: "The attribution only holds up under scrutiny."

  - name: "an idea placed at an intersection warns"
    expect: pass
    warns: [figurative-placement]
    text: "The proposal sits at the core of the migration."

  - name: "layer as an ordinary architecture noun passes"
    expect: pass
    text: "The adapter layer normalises the payload."

  - name: "the semantic layer is this project's own usage"
    expect: pass
    text: "The semantic layer judges what a regex cannot reach."

  - name: "a real location after is-where passes"
    expect: pass
    text: "Line 40 is where the parse fails."

  - name: "a mic-drop verdict warns"
    expect: pass
    warns: [mic-drop]
    text: "The cache was stale on every run. It matters."

  - name: "a mic-drop copula verdict warns"
    expect: pass
    warns: [mic-drop]
    text: "The retry runs twice on a 429. That is by design."

  - name: "the same words mid-sentence pass"
    expect: pass
    text: "It matters more than the cache size, which is why the retry runs twice."
