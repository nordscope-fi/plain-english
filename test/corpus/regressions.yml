# One case per escape that reached a user. These are permanent.
#
# The rule: when something slips through, the fix is not complete until a case
# lands here. A corpus that only grows by design intent misses the ways real
# text actually escapes.
#
#   channel   which adapter handles the payload (docs | github | issue)
#   agent     which agent sent it; claude-code when omitted
#   expect    deny | allow
#   files     written into a temp dir first; {{TMP}} in the payload resolves to it

cases:
  - name: "em dash in an issue title"
    channel: issue
    expect: deny
    rule: em-dash
    why: >-
      The guard read the description but never the title, so em-dash titles
      landed for months before anyone noticed. Seven of them.
    payload:
      tool_name: mcp__linear__save_issue
      tool_input:
        title: "Refresh token race — two workers, one mandate"
        description: "Two workers can refresh the same token at once."

  - name: "em dash in a patch new_string"
    channel: issue
    expect: deny
    rule: em-dash
    why: "Patch edits were invisible for the same reason titles were."
    payload:
      tool_name: mcp__linear__save_issue
      tool_input:
        patch:
          - old_string: "the old wording"
            new_string: "the new wording — with a dash"

  - name: "old_string in a patch is NOT judged"
    channel: issue
    expect: allow
    why: >-
      old_string is existing text being replaced. Judging it means an agent
      fixing one line of a legacy body gets blocked by the rest of it.
    payload:
      tool_name: mcp__linear__save_issue
      tool_input:
        patch:
          - old_string: "Furthermore, we utilize a seamless paradigm shift."
            new_string: "The importer now retries once."

  - name: "git commit -F bypasses an inline-only scan"
    channel: github
    expect: deny
    rule: delve
    why: >-
      A guard that reads only the command string sees no message at all here.
      Any environment where -F is the habitual form is completely unguarded.
    files:
      msg.txt: |
        fix: correct the retry window

        Let us delve into why the first attempt failed.
    payload:
      tool_name: Bash
      tool_input:
        command: "git commit -F {{TMP}}/msg.txt"

  - name: "gh pr create --body-file bypasses an inline-only scan"
    channel: github
    expect: deny
    rule: em-dash
    files:
      body.md: |
        ## Summary

        Fixes the retry window — the first attempt used the wrong unit.
    payload:
      tool_name: Bash
      tool_input:
        command: "gh pr create --title 'fix: retry window' --body-file {{TMP}}/body.md"

  - name: "gh issue create -F bypasses an inline-only scan"
    channel: github
    expect: deny
    rule: furthermore
    files:
      issue.md: |
        The importer drops rows silently.

        Furthermore, the counter is never reset.
    payload:
      tool_name: Bash
      tool_input:
        command: "gh issue create -t 'importer drops rows' -F {{TMP}}/issue.md"

  - name: "git commit --amend --no-edit carries no new text"
    channel: github
    expect: allow
    why: "No message is being introduced, so there is nothing to judge."
    payload:
      tool_name: Bash
      tool_input:
        command: "git commit --amend --no-edit"

  - name: "read-only gh commands are never judged"
    channel: github
    expect: allow
    why: >-
      gh pr view output routinely contains other people's prose. Judging read
      commands makes the guard fire on text the agent did not write.
    payload:
      tool_name: Bash
      tool_input:
        command: "gh pr view 42 --json body"

  - name: "a missing -F target does not crash the guard"
    channel: github
    expect: allow
    why: "Fail-open. An unreadable path must never block a commit."
    payload:
      tool_name: Bash
      tool_input:
        command: "git commit -F {{TMP}}/does-not-exist.txt"

  - name: "MultiEdit was not matched by the original hook"
    channel: docs
    expect: deny
    rule: em-dash
    why: "Only Write and Edit were matched, so MultiEdit wrote unchecked."
    payload:
      tool_name: MultiEdit
      tool_input:
        file_path: "{{TMP}}/notes.md"
        edits:
          - old_string: "before"
            new_string: "after — with a dash"

  - name: "Edit judges only the inserted side"
    channel: docs
    expect: allow
    why: >-
      old_string is the text being removed. Blocking on it means you can never
      edit a file that already contains a banned word.
    payload:
      tool_name: Edit
      tool_input:
        file_path: "{{TMP}}/notes.md"
        old_string: "Furthermore, we utilize a seamless approach."
        new_string: "The importer retries once."

  - name: "non-markdown files are out of scope for the docs channel"
    channel: docs
    expect: allow
    payload:
      tool_name: Write
      tool_input:
        file_path: "{{TMP}}/config.json"
        content: '{"strategy": "leverage"}'

  - name: "codex writes markdown through apply_patch"
    channel: docs
    agent: codex
    expect: deny
    rule: em-dash
    why: >-
      Codex has no Write tool. It edits through apply_patch, so a guard that
      only knows Write and Edit sees nothing at all and allows every file it
      writes.
    payload:
      tool_name: apply_patch
      tool_input:
        input: |
          *** Begin Patch
          *** Add File: {{TMP}}/notes.md
          +The build failed — the cache was stale.
          *** End Patch

  - name: "an apply_patch touching only source is not prose"
    channel: docs
    agent: codex
    expect: allow
    why: >-
      One patch can add to a markdown file and a source file at once. Pooling
      their added lines runs prose rules over an identifier, so added text is
      kept per file.
    payload:
      tool_name: apply_patch
      tool_input:
        input: |
          *** Begin Patch
          *** Add File: {{TMP}}/x.ts
          +const leverage = 1;
          *** End Patch

  - name: "copilot sends its native camelCase envelope"
    channel: docs
    agent: copilot
    expect: deny
    rule: em-dash
    why: >-
      init installs Copilot in Claude-compatibility mode, but a hand-written
      config gets the camelCase event instead, where the fields are toolName
      and toolArgs.
    payload:
      toolName: edit
      toolArgs:
        path: "{{TMP}}/x.md"
        new_string: "The build failed — the cache was stale."

  - name: "codex apply_patch carries the patch under tool_input.command"
    channel: docs
    agent: codex
    expect: deny
    rule: leverage
    why: >-
      The adapter looked for input, patch, patch_text and content, guesses made
      when the schema was unpublished. codex-rs emits tool_input.command, so it
      read an empty string and allowed every Codex file write.
    payload:
      tool_name: apply_patch
      tool_input:
        command: |
          *** Begin Patch
          *** Add File: {{TMP}}/notes.md
          +We leverage this.
          *** End Patch

  - name: "apply_patch run at the shell arrives as a Bash call"
    channel: github
    agent: codex
    expect: deny
    rule: leverage
    why: >-
      shell.rs calls intercept_apply_patch, so a model writing
      `apply_patch <<PATCH` gets a real file write through a call that reports
      tool_name Bash. That lands on the github channel, which reads commit and
      gh message text and finds none, so the file was written unjudged.
    payload:
      tool_name: Bash
      tool_input:
        command: |
          apply_patch <<'PATCH'
          *** Begin Patch
          *** Add File: {{TMP}}/notes.md
          +We leverage this.
          *** End Patch
          PATCH

  - name: "a shell apply_patch touching only source is not prose"
    channel: github
    agent: codex
    expect: allow
    why: "The same per-file split a native apply_patch gets."
    payload:
      tool_name: Bash
      tool_input:
        command: |
          apply_patch <<'PATCH'
          *** Begin Patch
          *** Add File: {{TMP}}/x.ts
          +const leverage = 1;
          *** End Patch
          PATCH

  - name: "copilot sends toolArgs as an escaped JSON string"
    channel: docs
    agent: copilot
    expect: deny
    rule: leverage
    why: >-
      Copilot's camelCase mode sends toolArgs as a JSON string, not an object,
      and its own tutorial says so. asRecord turned the string into {} and the
      hook allowed everything. copilot-cli#3349 exists because a hook that
      forgets this is a policy that silently passes.
    payload:
      toolName: create
      # A relative path on purpose. Substituting {{TMP}} inside a JSON string
      # would build `C:\Users\...` on Windows, which is an invalid escape, and
      # the parse would fail rather than the assertion.
      toolArgs: '{"path":"notes.md","content":"We leverage this."}'

  - name: "copilot with an empty tool_input beside a populated toolArgs"
    channel: docs
    agent: copilot
    expect: deny
    rule: leverage
    why: >-
      What a vendor mid-rename looks like. `??` falls through on null and
      undefined only, so it stopped at the empty object and read nothing.
    payload:
      tool_name: Write
      tool_input: {}
      toolArgs:
        file_path: "{{TMP}}/x.md"
        content: "We leverage this."

  - name: "a real Cursor preToolUse Write, captured from the CLI"
    channel: docs
    agent: cursor
    expect: deny
    rule: leverage
    why: >-
      Captured from cursor-agent 2026.08.04-aaa8809 with PLAIN_ENGLISH_RECORD
      set, because nobody had published the argument names inside a Cursor
      Write and the adapter was guessing at four spellings. They are file_path
      and content. The envelope is kept whole on purpose: Cursor sends no cwd,
      it sends workspace_roots, and reading the wrong one puts the project
      scope wherever the hook process happened to start.
    payload:
      conversation_id: "86bba682-45e5-43d0-af50-eb9b085a306d"
      generation_id: "86bba682-45e5-43d0-af50-eb9b085a306d"
      model: default
      tool_name: Write
      tool_input:
        file_path: "{{TMP}}/notes.md"
        content: "We leverage this approach to showcase a seamless workflow."
      tool_use_id: "call-b8ac8da8-0"
      session_id: "86bba682-45e5-43d0-af50-eb9b085a306d"
      hook_event_name: preToolUse
      cursor_version: "2026.08.04-aaa8809"
      workspace_roots:
        - "{{TMP}}"

  - name: "a real Cursor Shell call, captured from the CLI"
    channel: github
    agent: cursor
    expect: deny
    rule: furthermore
    why: >-
      Cursor names the shell tool Shell, not Bash, and its arguments are
      command, cwd and timeout. Both confirmed from the same session.
    payload:
      tool_name: Shell
      hook_event_name: preToolUse
      tool_input:
        command: 'git commit -m "Furthermore, fix the cache"'
        cwd: "{{TMP}}"
        timeout: 30
      workspace_roots:
        - "{{TMP}}"

  - name: "Cursor Read and Grep calls are not prose channels"
    channel: docs
    agent: cursor
    expect: allow
    why: "Both fire preToolUse in the CLI. Neither writes anything."
    payload:
      tool_name: Grep
      hook_event_name: preToolUse
      tool_input:
        pattern: leverage
        glob: "*.md"
        output_mode: content
      workspace_roots:
        - "{{TMP}}"

