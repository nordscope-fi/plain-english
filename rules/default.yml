# plain-english default ruleset
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH.
#
# docs/writing-style.md and integrations/claude-code/prompts/*.txt are GENERATED
# from this file by `plain-english render`. CI fails if they drift. Never edit
# the generated files by hand; edit this one and re-render.
#
# severity:
#   error  blocks the write and exits non-zero
#   warn   reported, never blocks
#
# unless:
#   regexes that cancel a match. Use these for words with a legitimate
#   technical or domain sense. A match inside code, a URL, or a blockquote is
#   already excluded by the masking pass and needs no `unless` entry.

version: 1

meta:
  title: "Writing Style: AI-Tell Patterns to Cut"
  intro: >-
    Applies to everything written in or by this project: chat replies, docs,
    commit messages, PR descriptions, and issue text. Not just the channels a
    hook can check.

punctuation:
  - id: em-dash
    severity: error
    match: "—"
    message: "No em dashes. Use a comma, parentheses, or a full stop."
    link: "https://github.com/nordscope-fi/plain-english/blob/main/docs/limitations.md#the-em-dash-rule"

  # A rate-based alternative, shipped off by default.
  #
  # Some published comparisons measure em dash use as a rate (roughly 10.6 per
  # 1,000 words for GPT-4.1 against a cited baseline of 3.23). That baseline is
  # drawn from professionally edited prose, where the em dash is a normal
  # typographic device. In ordinary workplace and technical writing the base
  # rate is near zero, so for most documents presence is the signal and a
  # threshold only adds a way to miss it.
  #
  # This rule exists for anyone editing in a register where em dashes are
  # genuinely common, such as published essays or long-form journalism.
  #
  # To use it:  em-dash -> severity: off, em-dash-density -> severity: warn
  - id: em-dash-density
    severity: off
    match: "—"
    perThousandWords: 6
    message: "Em dash rate is above the configured threshold."
    link: "https://github.com/nordscope-fi/plain-english/blob/main/docs/limitations.md#the-em-dash-rule"

  - id: en-dash-as-punctuation
    severity: warn
    match: "\\s–\\s"
    message: "An en dash used as a sentence break is the same tell as an em dash."

rules:
  # ---------------------------------------------------------------- stock transitions
  - id: furthermore
    severity: error
    match: "\\bfurthermore\\b"
    message: "Start the sentence with its own point."

  - id: moreover
    severity: error
    match: "\\bmoreover\\b"
    message: "Start the sentence with its own point."

  - id: in-conclusion
    severity: error
    match: "\\bin conclusion\\b"
    message: "State the conclusion. Do not announce it."

  - id: worth-noting
    severity: error
    match: "\\bit'?s worth noting\\b|\\bit is worth noting\\b|\\bit is important to note\\b"
    message: "If it is worth noting, note it."

  - id: at-the-end-of-the-day
    severity: error
    # Only the discourse-marker use (followed by a comma). The literal temporal
    # sense ("the batch runs at the end of the day") stays legal.
    match: "\\bat the end of the day,"
    message: "Cut the phrase and state the point."

  - id: lets-dive-in
    severity: error
    match: "\\blet'?s dive in\\b"
    message: "Start with the content."

  - id: dive-into
    severity: warn
    match: "\\bdiv(e|es|ing) into\\b"
    unless:
      - "\\bdiv(e|es|ing) into (the )?(pool|water|sea|ocean|wreck)\\b"
    message: "Usually 'read', 'look at', or just the verb for what you are doing."

  # ---------------------------------------------------------------- corporate verbs
  - id: leverage
    severity: error
    match: "\\bleverag(e|es|ed|ing)\\b"
    unless:
      # Finance and engineering senses are real terms.
      - "\\b(financial|operating|debt|net|balance.sheet)\\s+leverage\\b"
      - "\\bleverage\\s+(ratio|point|effect)\\b"
      - "\\bleveraged\\s+(buyout|loan|finance|etf)\\b"
    message: "Use 'use'."

  - id: utilize
    severity: error
    # Deliberately does not match 'utilization', a real capacity-planning term.
    match: "\\butiliz(e|es|ed|ing)\\b|\\butilis(e|es|ed|ing)\\b"
    message: "Use 'use'."

  - id: delve
    severity: error
    match: "\\bdelv(e|es|ed|ing)\\b"
    message: "Use 'look at', 'read', or 'go through'."

  - id: showcase
    severity: error
    match: "\\bshowcas(e|es|ed|ing)\\b"
    unless:
      - "\\b(glass|display|trophy|museum)\\s+showcase\\b"
    message: "Use 'show'."

  - id: boasts
    severity: error
    match: "\\bboasts\\b"
    unless:
      - "\\bboasts?\\s+about\\b"
    message: "State the number without the verb: 'uptime is 99.9%'."

  - id: underscores-verb
    severity: warn
    # The AI tell is always the transitive verb ("this underscores the need").
    # Requiring a following determiner keeps the plural noun ("the filename
    # underscores are significant") out of scope without needing an exception.
    match: "\\bunderscor(es|ed|ing)\\s+(the|that|this|these|those|a|an|how|why|just|again|its|our|their|his|her)\\b"
    unless:
      # Identifier context, where the word is a literal character name.
      - "_"
    message: "Use 'shows', 'proves', or drop the sentence."

  # ---------------------------------------------------------------- buzzwords
  - id: seamless
    severity: error
    match: "\\bseamless(ly)?\\b"
    unless:
      # Manufacturing sense.
      - "\\bseamless\\s+(pipe|tube|steel|garment|knit|weld)\\b"
    message: "Say what actually happens, or cut the word."

  - id: cutting-edge
    severity: error
    # Bounded so 'cutting edges of the sheet' does not match.
    match: "\\bcutting[- ]edge\\b"
    message: "Name the thing that is new."

  - id: holistic
    severity: warn
    match: "\\bholistic(ally)?\\b"
    unless:
      - "\\bholistic\\s+(medicine|health|healing|therapy|wellness|practitioner|nutrition)\\b"
    message: "Say which parts you mean."

  - id: synergy
    severity: error
    match: "\\bsynerg(y|ies|istic|istically)\\b"
    message: "Name the actual benefit."

  - id: paradigm-shift
    severity: error
    match: "\\bparadigm shift\\b"
    message: "Say what changed."

  - id: game-changer
    severity: error
    match: "\\bgame[- ]chang(er|ing)\\b"
    message: "Say what it changes."

  - id: unlock-the
    severity: error
    # Only the marketing sense. 'unlock the door' and 'unlock the account' pass.
    match: "\\bunlock (the|your) (potential|power|value|secret|secrets|full)\\b"
    message: "Say what becomes possible."

  - id: elevate-your
    severity: error
    match: "\\belevate your\\b"
    message: "Say what improves."

  - id: in-todays-x
    severity: error
    match: "\\bin today'?s (fast[- ]paced|digital|business|competitive|modern)\\b"
    message: "Cut the opener and start with the point."

  # ---------------------------------------------------------------- AI self-reference
  - id: as-an-ai
    severity: error
    match: "\\bas an AI\\b|\\bas a large language model\\b"
    message: "Cut it."

  # ---------------------------------------------------------------- soft-focus adverbs
  # These have real technical senses, so they warn instead of blocking.
  - id: silently
    severity: warn
    match: "\\bsilent(ly)?\\b"
    unless:
      - "\\bfails?\\s+silently\\b"
      - "\\bfailed\\s+silently\\b"
      - "\\bsilently\\s+(ignor|drop|discard|swallow|skip|truncat|overwrit|fail)"
      - "\\bsilent\\s+(mode|install|failure|corruption|film|letter|partner)\\b"
    message: "Say what happened and what it affected."

  - id: quietly
    severity: warn
    match: "\\bquietly\\b"
    message: "Say what happened and what it affected."

  - id: mechanical
    severity: warn
    match: "\\bmechanical(ly)?\\b"
    unless:
      - "\\bmechanical\\s+(keyboard|engineer|engineering|turk|advantage|ventilation|seal|watch|pencil|switch|failure|load|part|component)\\b"
    message: "Say what the process actually does."

  - id: load-bearing
    severity: error
    match: "\\bload[- ]bearing\\b"
    unless:
      # Structural engineering sense.
      - "\\bload[- ]bearing\\s+(wall|walls|beam|column|member|structure|capacity|frame)\\b"
    message: "Say what depends on it."

  # ---------------------------------------------------------------- padding
  # Fixed phrases that carry no information. This is Strunk's rule 13, omit
  # needless words, and it is the one piece of a general style guide that fits
  # here: the phrases are a closed set, so they can be checked exactly, and a
  # model reaches for them far more often than a person does.
  #
  # All warn. None of them is wrong, only long, and a rule that blocks on a
  # phrase this ordinary is the kind of gate people learn to route around.
  #
  # Two of Strunk's rules deliberately did not come across. Passive voice and
  # the "there is" opener both need a reader to tell a weak use from a correct
  # one, and both fired on this project's own hand-edited docs: "are covered
  # by", "is accepted by", "There is no config needed". Those belong to a
  # general prose linter such as Vale, which the README already points at.
  - id: the-fact-that
    severity: warn
    match: "\\bthe fact that\\b"
    message: "Cut it: 'despite the fact that' is 'though'."

  - id: in-order-to
    severity: warn
    match: "\\bin order to\\b"
    message: "Use 'to'."

  - id: in-terms-of
    severity: warn
    match: "\\bin terms of\\b"
    unless:
      # The mathematical sense: one quantity written using another.
      - "\\b(express|expresses|expressed|defines?|defined|solves?|solved|writes?|written|rewritten|measures?|measured|states?|stated)\\s+in terms of\\b"
    message: "Name the relation, or use 'in' or 'for'."

  - id: able-to
    severity: warn
    match: "\\b(is|are|was|were|be|been|being)\\s+able to\\b|\\bha(s|ve|d)\\s+the ability to\\b"
    message: "Use 'can'."

  - id: a-number-of
    severity: warn
    match: "\\ba (number|variety) of\\b"
    message: "Say how many, or cut the phrase."

  - id: in-a-manner
    severity: warn
    # 'manner' and 'fashion' only. "in a useful way" is ordinary English, and
    # firing on it would police writing that is already clear.
    match: "\\bin (a|an) [a-z]+ (manner|fashion)\\b"
    message: "Use the adverb: 'in a hasty manner' is 'hastily'."

  - id: as-to-whether
    severity: warn
    match: "\\b(the question )?as to whether\\b"
    message: "Use 'whether'."

  - id: not-un
    severity: warn
    match: "\\bnot un[a-z]+\\b"
    unless:
      # Ordinary words that begin with 'un', where the negation is not a
      # rhetorical softener.
      - "\\bnot un(less|til|der|dergoing|do|done)\\b"
      # Negations a technical document makes on purpose. "not undefined" and
      # "not unique" are statements of fact, not litotes.
      - "\\bnot un(ique|defined|set|initialised|initialized|installed|available|mounted|locked|committed|staged|tracked|read|used|packed|zipped|reachable|supported)\\b"
    message: "Say what it is: 'not uncommon' is 'common'."

  - id: prior-to
    severity: warn
    match: "\\bprior to\\b"
    message: "Use 'before'."

  - id: with-respect-to
    severity: warn
    match: "\\bwith (respect|regard|regards) to\\b"
    message: "Use 'about', or name the relation."

# Readability. These measure the shape of the prose rather than matching a term.
#
# The complaint these answer is "I get lost", which turned out not to be about
# length. A worked example, 26 words and five unexplained terms:
#
#   "The OIDC trusted publisher attaches SLSA provenance to the tarball at
#    publish time, which the registry verifies against the workflow identity
#    asserted by the id-token claim."
#
# That is an ordinary-length technical sentence. What makes it hard is that
# nothing in it was ever explained. So `unglossed-term` is the rule that earns
# its place here, and `long-sentence` is set generously enough to leave dense
# but explained writing alone.
readability:
  - id: unglossed-term
    severity: warn
    # An acronym of three or more letters, or a camel-cased name. Reported on
    # first use only: repeating an acronym is not the problem, introducing one
    # without saying what it does is.
    #
    # Suppressed by any `allow` entry, which is how a project declares its own
    # vocabulary, and by the `known` list below.
    kind: unglossed-term
    message: "Say what it does, then name it."
    link: "https://github.com/nordscope-fi/plain-english/blob/main/docs/writing-style.md#readability"
    # Names a reader already knows. Without these the rule fires on "GitHub",
    # which is a camel-cased word and not jargon by any useful definition.
    #
    # This list is deliberately short and covers only names common enough that
    # explaining them would insult the reader. Anything domain-specific belongs
    # in a project's own `allow`, not here.
    known:
      # Platforms and companies
      - GitHub
      - GitLab
      - YouTube
      - LinkedIn
      - PayPal
      - DeepMind
      - OpenAI
      - PostgreSQL
      - MongoDB
      - MySQL
      - SQLite
      - DynamoDB
      - JetBrains
      - WordPress
      - SharePoint
      - PowerPoint
      - HubSpot
      - MailChimp
      - QuickBooks
      # Languages, runtimes and formats
      - JavaScript
      - TypeScript
      - CoffeeScript
      - PostScript
      - JSON
      - YAML
      - TOML
      - HTML
      - CSS
      - SQL
      - XML
      - CSV
      - PDF
      - PNG
      - JPEG
      - SVG
      - URL
      - URI
      - API
      - CLI
      - GUI
      - IDE
      - OS
      - macOS
      - iOS
      - iPhone
      - iPad
      - NodeJS
      - jQuery
      - GraphQL
      - WebSocket
      - WebAssembly
      - OAuth
      - HTTP
      - HTTPS
      - FTP
      - SSH
      - TLS
      - SSL
      - DNS
      - IP
      - CPU
      - GPU
      - RAM
      - USB
      - PDF
      # Repository and document conventions. These name a file or a licence,
      # not a concept, so there is nothing to explain.
      - README
      - CHANGELOG
      - LICENSE
      - CONTRIBUTING
      - TODO
      - MIT
      - GPL
      - BSD
      # Everyday abbreviations
      - FAQ
      - PDF
      - CEO
      - CTO
      - VAT
      - EU
      - UK
      - USA
      - PhD

  - id: long-sentence
    severity: warn
    kind: long-sentence
    # 25 would police ordinary technical writing. 35 catches genuinely tangled
    # sentences and leaves depth alone.
    maxWords: 35
    message: "Split this. One idea per sentence."
    link: "https://github.com/nordscope-fi/plain-english/blob/main/docs/writing-style.md#readability"

  # A waiver records that somebody silenced a rule, and nothing about why. The
  # reader who meets it later cannot tell a considered exception from a rule
  # somebody found annoying, so the waiver cannot be reviewed or removed.
  #
  # This one rule ignores in-file suppression. It has to: `disable-file`
  # silences every rule in the document, so a reasonless `disable-file` would be
  # the single waiver that could never be reported. It is turned off in config,
  # or by an `allow` pattern matching the line, and by nothing else.
  - id: unexplained-suppression
    severity: warn
    kind: unexplained-suppression
    message: "Say why after a colon: `disable leverage: finance sense`."
    link: "https://github.com/nordscope-fi/plain-english/blob/main/docs/writing-style.md#suppressions"

# Sentence shapes a regex cannot reach. These are checked by the semantic layer
# only. `render` copies them into the generated prompt text and into the docs.
structures:
  - id: binary-contrast
    name: "Binary contrast cliche"
    description: "Stating what something is not, then what it is, as a rhetorical flourish."
    bad: "This isn't just a bug. It's a trust problem."
    good: "This bug will make people distrust the report."

  - id: short-clause-contrast
    name: "Short-clause contrast (X rather than Y)"
    description: >-
      The same move compressed into one clause. Needs judgment: "rather than" is
      often perfectly ordinary ("fix the cause rather than the symptom"). Flag it
      only when it is a paired noun-vs-noun contrast added for effect.
    bad: "Treat that as a floor rather than a rate."
    good: "Treat that as a floor: real usage is probably higher, since the sample skews toward older records."

  - id: throat-clearing
    name: "Throat-clearing opener"
    description: "Stalling before the actual point."
    bad: "Here's the thing: the deal stalled because..."
    good: "The deal stalled because..."

  - id: faux-insight
    name: "Faux-insight setup"
    description: "Manufactured suspense before a plain fact."
    bad: "What nobody tells you about churn is..."
    good: "State the fact directly."

  - id: weasel-attribution
    name: "Weasel attribution"
    description: "A claim backed by an unnamed authority."
    bad: "Experts agree this is best practice."
    good: "Name the actual source, or drop the claim."

  - id: fake-strong-verbs
    name: "Fake-strong verbs on weak claims"
    description: "Inflating what something plainly does."
    bad: "This property serves as a centralized hub for deal stage."
    good: "This property stores the deal stage."

  - id: meta-commentary
    name: "Meta-commentary about the writing itself"
    description: "Narrating that you are being clear or honest instead of just being clear or honest."
    bad: "To be transparent, I want to flag that..."
    good: "State the flag."

  - id: synonym-cycling
    name: "Synonym cycling"
    description: "Restating the same point across consecutive sentences in near-identical words to sound thorough."
    bad: "This is a major issue. It's a significant problem. This really matters."
    good: "Say it once."

  - id: hedging-stacks
    name: "Hedging stacks"
    description: "Piling up qualifiers instead of picking one."
    bad: "It's possible that this might potentially cause..."
    good: "This could cause..."
