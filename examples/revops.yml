# Sample project config for a revenue-operations repo.
#
# Copy to `.plain-english.yml` at your repo root and edit. This file exists to
# show the shape of a project config, not to prescribe anyone's vocabulary.
#
# The point of `extends: default` is that you never fork the ruleset. You add
# your own vocabulary, exclude the files that quote banned terms on purpose,
# and adjust individual severities. Upstream rule fixes still reach you.

version: 1
extends: default

# Your vocabulary. Two shapes, and the difference matters.
#
# A bare string silences EVERY rule on any line it matches. That is a large
# promise. An earlier version of this file used it for all eleven entries
# below; measured afterwards, one of them was hiding 247 findings that had
# nothing to do with vocabulary, and nine were hiding nothing at all. Run
# `plain-english lint --show-suppressed` to see what yours cost.
#
# The mapping form names the rules the entry is for, and `semantic: true`
# passes the same words to the model that judges sentence shapes, which reads
# no config of its own.
allow:
  # Acronyms your readers use daily. These are what `unglossed-term` fires on.
  - pattern: "\\bMRR\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\bARR\\b"
    rules: [unglossed-term]
    semantic: true

  # Object names. Ordinary words in this domain, and the model asks for a gloss
  # on them unless it is told not to.
  - pattern: "\\b(Deal|Contact|Company|Ticket)\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\bSegments?\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\bSnippets?\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\bpicklist\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\bpipeline stages?\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\bsequences?\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\benrollments?\\b"
    rules: [unglossed-term]
    semantic: true
  - pattern: "\\bworkflows?\\b"
    rules: [unglossed-term]
    semantic: true

  # Namespaced property names, which are identifiers and not prose.
  - pattern: "hs_[a-z_]+"
    rules: [unglossed-term]
    semantic: true

# Files the linter skips entirely. Anything that quotes the banned list as
# reference material belongs here.
exclude:
  - "docs/writing-style.md"
  - "docs/verbatim-quotes/**"
  - "CHANGELOG.md"
  - "**/*.min.*"

# Adjust individual rules without forking the file.
rules:
  # A sales-adjacent repo writes "showcase" about customer stories often enough
  # that blocking on it costs more than it saves.
  - id: showcase
    severity: warn

  # This repo documents structural work, so the engineering sense dominates.
  - id: load-bearing
    severity: off
