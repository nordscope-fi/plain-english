name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run has nothing to tell us, and while runner capacity is tight
# it competes with the run that does. Cancel the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check. A private reference must never reach a public commit, so
  # this runs first and independently of the build.
  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/check-no-private-refs.sh
      - run: bash scripts/check-no-private-refs.sh --history

  # A CLI runs on other people's machines, so path handling, shell quoting and
  # line endings have to be exercised on Windows and macOS. A full 3x3 cross
  # product is the wrong way to buy that: GitHub bills macOS at 10x and Windows
  # at 2x, so 9 jobs cost ~78 billed minutes per run, which exhausts a
  # 2,000-minute monthly allowance in about 25 runs.
  #
  # Node versions vary on Linux, where minutes are 1x. Windows and macOS get
  # one job each on the current LTS, which is enough to catch platform bugs:
  # the POSIX-only exec-bit assertion failed on every Windows version equally.
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  drift:
    name: Generated docs match rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        # `render` and `lint:self` both run `node dist/cli.js`, and dist/ is
        # gitignored. Without this build step the job dies on MODULE_NOT_FOUND,
        # which is exactly how these two jobs shipped red.
      - run: npm run build
      - run: npm run render
      - name: Fail if render changed anything
        run: |
          if ! git diff --exit-code -- docs integrations; then
            echo "::error::rules/default.yml changed but generated files were not committed. Run 'npm run render'."
            exit 1
          fi
        # The policy document is generated from the merged config rather than
        # from the shipped ruleset, so it drifts on a config change that
        # `render` does not see.
      - run: npm run policy:check

  dogfood:
    name: Repo lints itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:self

  packaging:
    name: Package is publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # publint catches exports/files/bin mistakes that only surface as a
      # broken install for a consumer, long after publish.
      - run: npx --yes publint
      - run: npx --yes @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm
      # A consumer install is the only honest test that the tarball is complete.
      - name: Install the tarball into a clean project and run it
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install /tmp/*.tgz --no-audit --no-fund
          printf 'We leverage a seamless paradigm shift.\n' > doc.md
          npx plain-english lint doc.md --fail-on never
          npx plain-english --version
