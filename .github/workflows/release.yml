name: Release

# Publishes to npm on a version tag, using OIDC trusted publishing.
#
# There is no NPM_TOKEN anywhere in this repository, and there should never be
# one. npm revoked all classic tokens on 2025-12-09, and trusted publishing
# replaces them: npm verifies the workflow identity directly from GitHub's OIDC
# token, and attaches provenance automatically.
#
# ONE-TIME SETUP, in this order. The order matters and is not obvious:
#
#   1. Publish 0.1.0 by hand from a terminal (`npm login && npm publish`).
#      A trusted publisher cannot be configured for a package name that does
#      not exist yet, so the first release cannot use this workflow.
#   2. npmjs.com -> the package -> Settings -> Trusted Publisher. Register:
#        Organization or user:  nordscope-fi
#        Repository:            plain-english
#        Workflow filename:     release.yml     (filename only, no path)
#        Environment:           npm
#   3. npmjs.com -> the package -> Settings -> Publishing access ->
#      "Require two-factor authentication and disallow tokens".
#   4. GitHub -> Settings -> Environments -> create `npm`. It carries no
#      reviewer: npm's trusted publisher registration names this environment,
#      so it has to exist, and gating it on a person is what this workflow
#      exists to stop needing.
#
# After that, a release is a merge. Put the version bump in the pull request
# with `npm version <bump> --no-git-tag-version`, and merging it ships.
#
# Two gates run before the publish job, and both must pass: `matrix-test`
# mirrors the CI matrix across operating systems and Node versions, and
# `verify` runs the single-platform checks (private refs, self-lint, generated
# file drift, packaging).

on:
  push:
    # A merge to main releases when package.json carries a version nothing has
    # tagged yet. A tag push still works and is the by-hand path.
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What, if anything, this run releases.
  #
  # Two ways in, and they answer the same question from different sides. A push
  # to main releases when package.json names a version no tag points at, which
  # is how a merged pull request ships: the bump rides in the pull request, so
  # merging it is the release and nobody has to remember a second step. A tag
  # push is the older path, kept for a release made by hand.
  #
  # A merge that carries no bump releases nothing and costs only this job. That
  # is also the escape hatch: a documentation change ships when somebody
  # decides it should, not because it landed.
  decide:
    name: What this run releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.q.outputs.release }}
      version: ${{ steps.q.outputs.version }}
      tag: ${{ steps.q.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are the whole question here, and a shallow clone has none.
          fetch-depth: 0
      - id: q
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # A tag that disagrees with package.json publishes something other
            # than what it claims to be, so it fails here rather than later.
            if [ "$VERSION" != "$PKG" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
              exit 1
            fi
            RELEASE=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # The manual override. It republishes whatever main currently says,
            # which is what somebody reaching for it wants.
            VERSION="$PKG"
            RELEASE=true
          elif git rev-parse -q --verify "refs/tags/v$PKG" >/dev/null; then
            VERSION="$PKG"
            RELEASE=false
          else
            VERSION="$PKG"
            RELEASE=true
          fi
          {
            echo "release=$RELEASE"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" = "true" ]; then
            echo "::notice::releasing v$VERSION"
          else
            echo "::notice::v$VERSION is already tagged, nothing to release"
          fi

  # The same matrix CI runs. Without it the publish gate was weaker than the
  # gate on an ordinary pull request: v0.2.0 released green while its CI run
  # was red on Windows, because verify only ever ran ubuntu-latest and never
  # saw the failing job. A release must not be easier to pass than a PR.
  matrix-test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: [decide]
    if: needs.decide.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  verify:
    name: Verify before publishing
    needs: [decide]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash scripts/check-no-private-refs.sh
      - run: bash scripts/check-no-private-refs.sh --history
      - run: npm run lint:self
      - name: Generated files are current
        run: |
          npm run render
          git diff --exit-code -- docs integrations
      - run: npx --yes publint
      - run: npx --yes @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm

  # The tag, made after every gate has passed rather than before any of them.
  #
  # That inverts what a tag used to mean here. It was the trigger, so it said
  # "somebody wants this released"; now it is a result, so it says "this
  # passed". A tag pushed with GITHUB_TOKEN raises no workflow run, which is
  # what stops this release from starting a second one of itself.
  tag:
    name: Tag ${{ needs.decide.outputs.tag }}
    needs: [decide, matrix-test, verify]
    if: needs.decide.outputs.release == 'true' && github.repository_owner == 'nordscope-fi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create it, unless it is already there
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists already, leaving it as it is."
            exit 0
          fi
          # Annotated, not lightweight: `gh release create --verify-tag` and
          # `git push --follow-tags` both treat the two differently.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  publish:
    name: Publish to npm
    needs: [decide, matrix-test, verify, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A fork pushing a tag must never be able to publish.
    if: needs.decide.outputs.release == 'true' && github.repository_owner == 'nordscope-fi'
    # Required by npm, not by us. The trusted publisher registration names this
    # environment, so the job has to run in it or the publish is rejected. It
    # carries no reviewer: a merge is the approval.
    environment: npm
    permissions:
      # write, not read, because the last step creates the GitHub Release.
      contents: write
      # This is what trusted publishing runs on. Without it npm cannot verify
      # the workflow identity and the publish is rejected.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # npm's own guidance: never cache in a release build.
          package-manager-cache: false
      - name: npm must be new enough for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          echo "npm $(npm --version), node $(node --version)"
          node -e "
            const [maj,min,pat] = process.versions.node.split('.').map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error('node >= 22.14.0 is required for trusted publishing');
              process.exit(1);
            }
          "
      - run: npm ci
      - run: npm run build
      # No --provenance flag: trusted publishing attaches provenance itself.
      - run: npm publish
      # Thirteen tags shipped before this step existed, and the Releases page
      # was empty for all of them while CHANGELOG.md held an entry for each.
      # Last, so a failure here cannot cost a publish that already succeeded.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/changelog-section.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
