version: 2
updates:
  # Actions on a faster cadence than dependencies: a compromised action is a
  # supply-chain problem, a stale library usually is not.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Vitest 5 requires Node 22; CI and the package still support Node 20.
      - dependency-name: vitest
        versions: [">=5 <6"]
      # Babel 8 excludes Node 20 and Node 22 before 22.18.0.
      - dependency-name: "@babel/parser"
        versions: [">=8 <9"]
      # These releases require Node 20.19.0; our minimum remains 20.0.0.
      - dependency-name: htmlparser2
        versions: [">=11 <13"]
      - dependency-name: entities
        versions: [">=8 <9"]
    groups:
      dev-dependencies:
        dependency-type: development
