version: 2
updates:
  # Actions on a faster cadence than dependencies: a compromised action is a
  # supply-chain problem, a stale library usually is not.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Vitest 5 requires Node 22; CI and the package still support Node 20.
      - dependency-name: vitest
        versions: [">=5 <6"]
    groups:
      dev-dependencies:
        dependency-type: development
