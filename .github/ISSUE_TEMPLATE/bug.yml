name: Bug
description: A crash, a wrong exit code, or an integration that misbehaves
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command, and the file or config if you can share it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `plain-english doctor`
      render: shell
    validations:
      required: true
